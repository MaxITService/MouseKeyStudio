macro_guide_body = "## Read a sequence\n\n- `+C` presses C and leaves it held. `-C` releases C.\n- `C` or `tap C` is a complete tap: `+C, -C`.\n- `50ms` pauses for 50 milliseconds (0.05 seconds). Delays are whole, non-negative milliseconds. `0ms` is allowed.\n- Separate steps with commas, semicolons or newlines. Compact steps also accept spaces: `+C 50ms -C`. Key names ignore case.\n- A shortcut needs separate steps: `+LeftCtrl, C, -LeftCtrl`. `Ctrl+C` belongs in the separate shortcut editor, not in a macro sequence. Pair held keys with releases.\n\n## Ctrl+C and Ctrl+V\n\nThe examples below preserve your saved key presses, releases and 50 ms timings. Ctrl stays held while C or V is pressed. Copy a complete example below, then use **Paste macro**. For one phase only, copy just its `on_press` string.\n\n## Hold one key while pressing several others\n\nThe Helldivers examples below come from the saved EAGLE Airstrike and Resupply macros. They hold **B** while pressing and releasing arrow keys, with 50 ms pauses between events. B is released at the end. These examples assume your game uses B and arrow keys; change them to match your bindings.\n\nEAGLE Airstrike: hold B → Up → Right → Down → Right → release B.\n\nResupply: hold B → Down → Down → Up → Right → release B.\n\nTo hold a key for the entire mouse-button press, put `+B` in **On press**, the other keys in **While holding**, and `-B` in **On release**. With repeat off, While holding runs once. With repeat on, only While holding loops until the mouse button is released.\n\n## Recording and phases\n\nSelect a phase before recording or adding steps. Recording appends keyboard events and their timing. Escape, Stop recording, moving focus away or leaving the window ends recording; Escape itself is not recorded. Recording adds releases for any keys still held when it stops. Edit the text to adjust timings or move a release to another phase.\n\n- **On press** starts when the assigned control is pressed.\n- **While holding** follows On press; enable **Repeat while held** to loop this phase.\n- **On release** runs when the assigned control is released. Releasing it can interrupt unfinished earlier phases, so put required cleanup here.\n\nThe summary counts steps and programmed delays for one pass through all phases. It excludes how long you hold the button and extra repetitions.\n\n## Complete macro text (JSON)\n\n**Edit macro as text** edits all five required fields:\n\n- `name`: a quoted name.\n- `on_press`, `while_held`, `on_release`: quoted step sequences. Use `\"\"` for an unused phase.\n- `repeat_while_held`: `true` or `false`, without quotes; affects only While holding.\n\nUse double quotes and commas between fields; no comments, extra fields or trailing commas. Inside JSON strings, write a backslash as `\\\\`, a double quote as `\\\"`, and a newline as `\\n`. Copy macro escapes these for you.\n\n**Use text in step editor** validates and returns to the step editor without assigning anything. **Discard text edits** restores the earlier step draft. **Save macro** assigns the macro to this control and profile. **Copy macro** copies every phase; ordinary Ctrl+C in a text field copies only selected text. **Paste macro** loads a complete document for review before saving.\n\n## Key names and punctuation\n\nUse explicit sides: `LeftCtrl` / `RightCtrl`, `LeftShift` / `RightShift`, `LeftAlt` / `RightAlt`, `LeftWin` / `RightWin`. Win is the logo key (Command on macOS); Ctrl stays Control. On macOS, replace LeftCtrl with LeftWin for Command shortcuts.\n\nModifier aliases: `LeftControl`, `LCtrl`, `RightControl`, `RCtrl`; `LShift`, `RShift`; `LeftOption`, `LAlt`, `RightOption`, `RAlt`; Left/Right forms of `Super`, `Meta`, `Cmd`, `Command`; `LWin`, `LSuper`, `LCmd`, `RWin`, `RSuper`, `RCmd`.\n\nOther aliases: `Return` = Enter; `Esc` = Escape; `Ins` = Insert; `Del` = Delete; `Page-Up` / `PgUp` = PageUp; `Page-Down` / `PgDn` = PageDown; `Print-Screen`, `Print`, `PrtSc`, `PrtScn`, `PrtScr` = PrintScreen.\n\nUse **Comma** and **Semicolon** for those keys: `+Comma, -Comma`. Literal comma and semicolon separate steps. Minus uses `+-` to press and `--` to release. Equals uses `+=, -=`. Plus is Shift with equals: `+LeftShift, =, -LeftShift` on a US layout. Other symbols may also require Shift. Keys are keyboard events; the active layout affects their output. For literal text, use the separate Type Text action where available.\n\nAlternative press forms: `↓C`, `C↓`, `down C`, `keydown C`, `key_down C`, `press C`, `down:C`, `C:down`, `C down`. Release forms use `↑`, `up`, `keyup`, `key_up` or `release`. Delays also accept `delay 50`, `delay 50ms`, `delay:50ms`, `wait 50ms`, `sleep 50ms`. The editor writes canonical `+Key`, `-Key`, `50ms` text.\n\nAll supported canonical names follow. CapsLock, media keys and numpad-specific keys are not supported in keyboard macros.\n\n%{keys}\n\n## Copyable complete examples\n\nLoad these as drafts with **Load example…**, or copy the JSON below. Save macro replaces one control’s current action."
