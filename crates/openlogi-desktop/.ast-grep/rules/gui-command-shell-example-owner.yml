# The selected shell and its syntax belong to binding_editor::CommandDraft.
id: gui-command-shell-example-owner
language: rust
severity: error
message: Use binding_editor::CommandDraft for shell defaults and examples so every editor follows the selected shell.
files:
  - crates/openlogi-desktop/src/**/*.rs
ignores:
  - crates/openlogi-desktop/src/features/binding_editor/shell_help.rs
rule:
  kind: string_literal
  regex: '^"Start-Process notepad\.exe"$'
